open:
  default: vim
  text:
    default: vim
    extension: 
      txt: vim
      sh: vim
      js: vim
      py: vim

  image:
    default: display
    extension:
      jpg: display
      png: display
      # ...
      
  video:
    default: mplayer
    extension:
      mp4: mplayer
      avi: mplayer
      # ...
  
exec:
  default: sh
  extension:
    py: python3
    js: node
    html: firefox
    # ...

trash:
  path:
  clean:
    time: 10 # in days
    size: 50 # in mb

aliases:  
  dev:
    path: /home/yx/files/nerd/dev
    action:
      main: nav
      files: open
      dirs: nav  
